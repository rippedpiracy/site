version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "master"
    open-pull-requests-limit: 5
    labels:
      - "bot"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # react-router-dom v7 drops the ./server.js subpath export that
      # vite-react-ssg imports during prerender. No vite-react-ssg release
      # supports v7 yet (0.9.2 still peers on ^6.14.1). See PR #12.
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "master"
    labels:
      - "bot"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
